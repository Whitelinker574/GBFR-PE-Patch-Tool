name: Windows Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_sha == github.sha &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      publish: ${{ steps.metadata.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Resolve release version and existing release
        id: metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content wails.json -Raw | ConvertFrom-Json).info.productVersion
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          $tag = "v$version"
          foreach ($path in @('frontend/package.json', 'frontend/package-lock.json')) {
            if ((Get-Content $path -Raw | ConvertFrom-Json -AsHashtable).version -ne $version) {
              throw "Version mismatch: $path"
            }
          }
          if (-not (Test-Path "docs/RELEASE_NOTES_$tag.md")) { throw 'Release notes missing.' }
          "version=$tag" >> $env:GITHUB_OUTPUT
          "commit=$env:RELEASE_COMMIT" >> $env:GITHUB_OUTPUT
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect existing releases.' }
          $existing = $releases | Where-Object { $_.tag_name -eq $tag }
          if ($existing -and -not $existing.draft) {
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            $jobs = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:CI_RUN_ID/jobs" | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect successful CI jobs.' }
            $testJob = @($jobs.jobs | Where-Object { $_.name -eq 'test' -and $_.conclusion -eq 'success' })
            if ($testJob.Count -ne 1) { throw 'Expected one successful CI test job.' }
            $logPath = Join-Path $env:RUNNER_TEMP 'native-ci-evidence.log'
            Invoke-WebRequest -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/jobs/$($testJob[0].id)/logs" `
              -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } -OutFile $logPath
            $ciLog = Get-Content $logPath -Raw
            $hashes = [regex]::Matches(($ciLog -join "`n"), 'Embedded patch_core.dll: ([0-9a-fA-F]{64})')
            if ($hashes.Count -ne 1) { throw 'Expected one CI native runtime SHA-256.' }
            "native_helper_hash=$($hashes[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT
            "publish=true" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/setup-go@v7
        if: steps.metadata.outputs.publish == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        if: steps.metadata.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned Wails build tool
        if: steps.metadata.outputs.publish == 'true'
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          if ($LASTEXITCODE -ne 0) { throw 'Wails installation failed.' }
          "$(go env GOPATH)/bin" >> $env:GITHUB_PATH

      - name: Verify release transaction protections
        if: steps.metadata.outputs.publish == 'true'
        shell: pwsh
        run: ./tools/test_windows_release_safety.ps1

      - name: Build and package exact tested commit
        if: steps.metadata.outputs.publish == 'true'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          RELEASE_COMMIT: ${{ steps.metadata.outputs.commit }}
          NATIVE_HELPER_HASH: ${{ steps.metadata.outputs.native_helper_hash }}
        run: |
          git switch --create release-build $env:RELEASE_COMMIT
          if ($LASTEXITCODE -ne 0) { throw 'Unable to attach the exact tested commit to the build branch.' }
          ./tools/package_windows_release.ps1 `
            -Version $env:RELEASE_VERSION `
            -Commit $env:RELEASE_COMMIT `
            -ExpectedNativeHelperHash $env:NATIVE_HELPER_HASH `
            -OutputDirectory "$env:RUNNER_TEMP/windows-release"
          Copy-Item "docs/RELEASE_NOTES_$env:RELEASE_VERSION.md" "$env:RUNNER_TEMP/windows-release/RELEASE_NOTES.md"

      - uses: actions/upload-artifact@v4
        if: steps.metadata.outputs.publish == 'true'
        with:
          name: windows-release
          path: |
            ${{ runner.temp }}/windows-release/*.exe
            ${{ runner.temp }}/windows-release/*.zip
            ${{ runner.temp }}/windows-release/SHA256SUMS-*.txt
            ${{ runner.temp }}/windows-release/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release

      - name: Verify and publish complete release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        shell: bash
        run: bash ../tools/publish_windows_release.sh
