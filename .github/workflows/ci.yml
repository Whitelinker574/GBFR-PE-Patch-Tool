name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            services/loadout-share/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install loadout-share dependencies
        working-directory: services/loadout-share
        run: npm ci

      - name: Build integrated native runtime
        shell: pwsh
        run: ./tools/build_patch_core.ps1 -Configuration Release

      - name: Generate Wails bindings
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force frontend/dist | Out-Null
          Set-Content frontend/dist/.embed-placeholder 'Wails embed placeholder'
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 generate module

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Enforce frontend performance budgets
        working-directory: frontend
        run: npm run check:bundle

      - name: Stress representative page switches
        shell: pwsh
        run: |
          $preview = Start-Process (Get-Command node).Source `
            -ArgumentList @(
              'node_modules/vite/bin/vite.js',
              'preview',
              '--host', '127.0.0.1',
              '--port', '4174',
              '--strictPort'
            ) `
            -WorkingDirectory frontend `
            -WindowStyle Hidden `
            -PassThru
          $browserPath = @(
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe",
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $browserPath) {
            throw 'No Chromium browser was found on the Windows runner.'
          }
          $browser = Start-Process $browserPath `
            -ArgumentList @(
              '--headless=new',
              '--remote-debugging-port=9223',
              "--user-data-dir=$env:RUNNER_TEMP\gbfr-ci-browser",
              'about:blank'
            ) `
            -WindowStyle Hidden `
            -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 40; $attempt += 1) {
              try {
                Invoke-WebRequest 'http://127.0.0.1:9223/json/version' -TimeoutSec 1 | Out-Null
                Invoke-WebRequest 'http://127.0.0.1:4174/' -TimeoutSec 1 | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $ready) {
              throw 'Chromium DevTools or the Vite preview did not become ready.'
            }
            node tools/qa_runtime_stress.mjs `
              --budget tools/performance-budget.json `
              --endpoint http://127.0.0.1:9223 `
              --url http://127.0.0.1:4174/ `
              --cycles 50 `
              --hidden-seconds 5 `
              --output "$env:RUNNER_TEMP\runtime-stress.json" `
              --enforce
          } finally {
            if ($browser -and -not $browser.HasExited) {
              taskkill /PID $browser.Id /T /F | Out-Null
            }
            if ($preview -and -not $preview.HasExited) {
              Stop-Process -Id $preview.Id -Force
            }
          }

      - name: Verify Go formatting
        shell: pwsh
        run: |
          $files = git ls-files '*.go'
          $unformatted = gofmt -l $files
          if ($unformatted) {
            $unformatted
            exit 1
          }

      - name: Vet and test Go code
        run: |
          # The two read-only Windows shared-memory readers receive mapped
          # addresses as uintptr from MapViewOfFile. Their bounds, protocol
          # version and seqlock validation are covered by dedicated tests;
          # keep every other vet analyzer enabled while excluding this known
          # syscall-boundary false positive.
          go vet -unsafeptr=false ./...
          go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 '-checks=all,-ST1003,-ST1005' ./...
          go test ./...

      - name: Test frontend
        run: node --test frontend/src/*.test.js

      - name: Test loadout-share worker
        working-directory: services/loadout-share
        run: npm test

      - name: Test maintainer tooling
        run: node --test tools/*.test.js
